name: Musa Video Factory — FREE
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic for the video
        required: true
        type: string
      language:
        description: Narration language
        required: true
        default: nl
        type: choice
        options: [nl, en]
      scenes:
        description: Number of scenes (1-5)
        required: true
        default: "5"
        type: choice
        options: ["1", "2", "3", "4", "5"]
      platform:
        description: Export format
        required: true
        default: shorts
        type: choice
        options: [tiktok, reels, shorts, youtube]
jobs:
  free-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install project
        run: pip install -e '.[tts]'
      - name: Create project and free narration scaffold
        run: |
          musa-video new --topic "${{ inputs.topic }}" --language "${{ inputs.language }}" --scenes "${{ inputs.scenes }}"
          PROJECT_DIR="$(find projects -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          musa-video free-script "$PROJECT_DIR"
      - name: Render zero-cost motion-graphic scenes
        run: musa-video free-render "$PROJECT_DIR"
      - name: Create voice-over (Edge TTS; no API key)
        run: musa-video narrate "$PROJECT_DIR"
      - name: Create captions and original ambient bed
        run: |
          musa-video captions "$PROJECT_DIR"
          musa-video music "$PROJECT_DIR" --duration "$(( ${{ inputs.scenes }} * 8 ))"
      - name: Assemble final video
        run: musa-video assemble "$PROJECT_DIR" --platform "${{ inputs.platform }}"
      - name: Save finished project
        uses: actions/upload-artifact@v4
        with:
          name: musa-free-video-${{ inputs.platform }}-${{ github.run_number }}
          path: projects/
          if-no-files-found: error

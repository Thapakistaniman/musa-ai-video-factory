name: Musa Video Factory (manual)
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic for the video
        required: true
        type: string
      language:
        description: Narration language (nl or en)
        required: true
        default: nl
        type: choice
        options: [nl, en]
      scenes:
        description: Number of 8-second scenes (1-5)
        required: true
        default: "5"
        type: choice
        options: ["1", "2", "3", "4", "5"]
      platform:
        description: Final export format
        required: true
        default: shorts
        type: choice
        options: [tiktok, reels, shorts, youtube]
      write_script:
        description: Generate AI narration script (may incur charges)
        required: true
        default: false
        type: boolean
      generate_images:
        description: Generate one AI storyboard image per scene (may incur charges)
        required: true
        default: false
        type: boolean
      generate_ai_music:
        description: Generate an original Lyria AI soundtrack (Google Cloud billing applies)
        required: true
        default: false
        type: boolean
      generate_video:
        description: Generate Veo video clips (may incur charges)
        required: true
        default: false
        type: boolean
      confirm_paid_generation:
        description: I have reviewed the estimated cost and explicitly approve paid AI generation
        required: true
        default: false
        type: boolean
      max_budget_usd:
        description: Maximum estimated generation budget in USD (guardrail, not a provider billing cap)
        required: true
        default: "20"
        type: choice
        options: ["2", "5", "10", "20", "30", "50"]
jobs:
  create-project:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project and optional TTS
        run: pip install -e '.[tts,cloud]'
      - name: Estimate cost and enforce budget approval
        env:
          SCENES: ${{ inputs.scenes }}
          WRITE_SCRIPT: ${{ inputs.write_script }}
          GENERATE_IMAGES: ${{ inputs.generate_images }}
          GENERATE_AI_MUSIC: ${{ inputs.generate_ai_music }}
          GENERATE_VIDEO: ${{ inputs.generate_video }}
          MAX_BUDGET: ${{ inputs.max_budget_usd }}
          CONFIRM_PAID: ${{ inputs.confirm_paid_generation }}
        run: |
          python - <<'PY'
          import os
          scenes = int(os.environ["SCENES"])
          # Conservative published-rate planning estimates; verify provider pricing before every run.
          video = scenes * 8 * 0.40 if os.environ["GENERATE_VIDEO"] == "true" else 0
          images = scenes * 0.067 if os.environ["GENERATE_IMAGES"] == "true" else 0
          music = 0.06 if os.environ["GENERATE_AI_MUSIC"] == "true" else 0
          script = 0.10 if os.environ["WRITE_SCRIPT"] == "true" else 0
          total = video + images + music + script
          budget = float(os.environ["MAX_BUDGET"])
          print(f"Estimated maximum planning cost: ${total:.2f} USD")
          print(f"Configured guardrail: ${budget:.2f} USD")
          print("Estimate assumes Veo 3.1 Standard at $0.40/sec and five 8-second scenes maximum.")
          if total > budget:
              raise SystemExit("Budget guardrail exceeded. Reduce scenes or increase the selected limit.")
          if total > 0 and os.environ["CONFIRM_PAID"] != "true":
              raise SystemExit("Paid generation is enabled but explicit cost approval is missing.")
          PY
      - name: Create storyboard
        run: musa-video new --topic "${{ inputs.topic }}" --language "${{ inputs.language }}" --scenes "${{ inputs.scenes }}"
      - name: Prepare project path
        id: project
        run: echo "dir=$(find projects -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Write narration script (explicit opt-in)
        if: ${{ inputs.write_script }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          test -n "$GOOGLE_API_KEY" || (echo "Missing GOOGLE_API_KEY secret" && exit 1)
          musa-video write "${{ steps.project.outputs.dir }}" --generate
      - name: Generate storyboard stills (explicit opt-in)
        if: ${{ inputs.generate_images }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          test -n "$GOOGLE_API_KEY" || (echo "Missing GOOGLE_API_KEY secret" && exit 1)
          musa-video images "${{ steps.project.outputs.dir }}" --generate
      - name: Generate Veo clips (explicit opt-in)
        if: ${{ inputs.generate_video }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          test -n "$GOOGLE_API_KEY" || (echo "Missing GOOGLE_API_KEY secret" && exit 1)
          musa-video generate "${{ steps.project.outputs.dir }}" --generate
      - name: Generate voice-over and captions
        if: ${{ inputs.write_script }}
        run: |
          musa-video narrate "${{ steps.project.outputs.dir }}"
          musa-video captions "${{ steps.project.outputs.dir }}"
      - name: Authenticate Google Cloud for Lyria music
        if: ${{ inputs.generate_ai_music }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      - name: Generate original Lyria soundtrack (explicit opt-in)
        if: ${{ inputs.generate_ai_music }}
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: us-central1
        run: musa-video music-ai "${{ steps.project.outputs.dir }}" --generate
      - name: Create original ambient fallback bed
        if: ${{ inputs.generate_video && !inputs.generate_ai_music }}
        run: musa-video music "${{ steps.project.outputs.dir }}" --duration "$(( ${{ inputs.scenes }} * 8 ))"
      - name: Assemble final MP4
        if: ${{ inputs.generate_video }}
        run: musa-video assemble "${{ steps.project.outputs.dir }}" --platform "${{ inputs.platform }}"
      - name: Upload project and outputs
        uses: actions/upload-artifact@v4
        with:
          name: musa-video-${{ inputs.platform }}-${{ github.run_number }}
          path: projects/
          if-no-files-found: error
